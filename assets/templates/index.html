{% extends "post.html" %} {% block content %}

<div class="content-unit">
    <div id="index-light"></div>
    <h2 class="text-n index-title">My blog</h2>
    <div id="interactive-in-test">
        <textarea id="editor" rows="1" placeholder="Write a note here! It can't be empty, though."></textarea>
        <button onClick="onSave()">
            <span class="material-symbols-outlined">arrow_forward</span>
        </button>
    </div>
    <p class="text-n" id="interactive-history-expand">
        <span class="material-symbols-outlined" id="interactive-drop-down-indicator">arrow_right</span>
        Recent Notes
    </p>
    <div id="interactive-output"></div>
    <p class="text-n">
        Documentations
    </p>
    <ul id="list">
        <li><a href="{{ url_for('serve_post', post_name='20260515') }}">在我上学的时候选入部编版教材的鲁迅文集</a></li>
    </ul>
    <p class="text-n">
        Blogs
    </p>
    <ul id="list">
        <li><a href="{{ url_for('serve_post', post_name='20240404') }}">Apr 4 2024</a></li>
        <li><a href="{{ url_for('serve_post', post_name='20240604') }}">Jun 4 2024</a></li>
        <li><a href="{{ url_for('serve_post', post_name='20241004') }}">Oct 4 2024</a></li>
        <li><a href="{{ url_for('serve_post', post_name='20241123') }}">Nov 28 2024</a></li>
        <li><a href="{{ url_for('serve_post', post_name='20241128') }}">Jan 3 2025</a></li>
        <li><a href="{{ url_for('serve_post', post_name='20250103') }}">Jan 4 2025</a></li>
        <li><a href="{{ url_for('serve_post', post_name='20250121') }}">CS 2130 Lab 01</a></li>
        <li><a href="{{ url_for('serve_post', post_name='CS2100-Notes') }}">CS 2100 Notes</a></li>
        <li><a href="{{ url_for('serve_post', post_name='20260904') }}">Sep 4 2026</a></li>
    </ul>
    <div class="empty-box"></div>
</div>

<script>
    async function loadText() {
        const response = await fetch("https://interactive.jerryly.cn/text");
        const data = await response.json();
        if (data.posts.length === 0) {
            document.getElementById("interactive-output").innerHTML = "No recent notes";
        } else {
            document.getElementById("interactive-output").innerHTML = data.posts.map(post => `
            <div class="interactive-entry">
                <div>
                    <div>${post.text}</div>
                    <small>${post.time}</small>
                </div>
                <button id="interactive-delete" onclick="onDelete('${post.time}')">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
        `).join("");
        }
        document.getElementById("editor").value = "";
    }
    loadText();
    async function onSave() {
        const text = document.getElementById("editor").value.trim();
        if (text.length === 0) {
            return;
        } else {
            await fetch("https://interactive.jerryly.cn/text", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ text }),
            });
            loadText();
        }
    }
    async function onDelete(time) {
        await fetch("https://interactive.jerryly.cn/text", {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ time }),
        });
        loadText();
    }
    $("#interactive-history-expand").click(() => {
        $("#interactive-output").toggleClass("show");
        const indicator = $("#interactive-drop-down-indicator");
        const current = indicator.text().trim();
        indicator.text(current === 'arrow_right' ? 'arrow_drop_down' : 'arrow_right');
    });
</script>

{% endblock %}
