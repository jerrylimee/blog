    </ul>
    <div class="empty-box"></div>
</div>

<script>
    async function loadText() {
        const response = await fetch("https://interactive.jerryly.cn/text");
        const data = await response.json();
        document.getElementById("output").innerHTML = data.posts.map(post => `
            <div class="entry">
                <div>${post.text}</div>
                <small>${post.text}</small>
            </div>
        `).join("");
        document.getElementById("editor").value = "";
    }
    loadText();
    async function onSave() {
        const text = document.getElementById("editor").value;
        await fetch("https://interactive.jerryly.cn/text", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ text }),
        });
        loadText();
    }
</script>

{% endblock %}
